<script>
  (function initLoginPage() {
    const pwdInput = document.getElementById('login-password');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('password-eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    window.simulateOAuth = function(provider) {
      alert(`Connexion avec ${provider} en cours... Ya pas drap !`);
    };

    window.triggerPunchline = function() {
      const btn = document.getElementById('submit-cta');
      if (!btn) return;
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>VERIFICATION DU GAOU...</span> <span>⏳</span>`;
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = `<span>BIENVENUE DANS LE DJASSA !</span> <span>🎉</span>`;
        btn.classList.replace('bg-primary', 'bg-on-surface');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.replace('bg-on-surface', 'bg-primary');
          btn.disabled = false;
        }, 1600);
      }, 900);
    };
  })();
</script></main></body></html>
