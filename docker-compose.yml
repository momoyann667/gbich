services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — Base de données relationnelle principale
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gbich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gbich_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gbich_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gbich_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gbich_user} -d ${POSTGRES_DB:-gbich_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gbich_internal

  # ----------------------------------------------------------------------------
  # Redis 7.2 — Cache, Sessions OTP et Leaderboards Sorted Sets
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: gbich_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - gbich_internal

  # ----------------------------------------------------------------------------
  # MinIO — Stockage Objets S3 (Illustrations WebP, Vidéos HLS/MP4)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: gbich_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gbich_internal

  # ----------------------------------------------------------------------------
  # MinIO Init — Initialisation automatique du bucket de médias
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: gbich_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set gbich_s3 http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_dev_secret_key};
      /usr/bin/mc mb --ignore-existing gbich_s3/${MINIO_BUCKET_NAME:-gbich-media};
      /usr/bin/mc anonymous set download gbich_s3/${MINIO_BUCKET_NAME:-gbich-media};
      exit 0;
      "
    networks:
      - gbich_internal

  # ----------------------------------------------------------------------------
  # Backend API — FastAPI / Uvicorn ASGI
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gbich_backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: "${PROJECT_NAME:-GBICH'APP API}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DEBUG: "${DEBUG:-True}"
      HOST: "0.0.0.0"
      PORT: "8000"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:3000,http://127.0.0.1:8081,http://localhost:80,http://127.0.0.1:80}"
      POSTGRES_SERVER: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "${POSTGRES_USER:-gbich_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-gbich_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-gbich_db}"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_dev_secret_key}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-gbich-media}"
      MINIO_SECURE: "False"
      SECRET_KEY: "${SECRET_KEY:-gbich-insecure-development-secret-key-change-in-production}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gbich_internal

  # ----------------------------------------------------------------------------
  # Nginx — Passerelle Inverse, Terminaison SSL & Routage PWA / API
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: gbich_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - gbich_internal

networks:
  gbich_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
